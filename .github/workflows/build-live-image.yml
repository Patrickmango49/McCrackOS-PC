name: Build McCrack-COS live image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - "branding/**"
      - "scripts/**"
      - ".github/workflows/build-live-image.yml"

permissions:
  contents: read

concurrency:
  group: mccrack-cos-live-image
  cancel-in-progress: true

jobs:
  build:
    name: Build Debian Trixie KDE live image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            xorriso \
            debootstrap \
            squashfs-tools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            isolinux \
            syslinux-common
      - name: Patch live-build Contents index lookup
        run: |
          # Debian publishes Contents indexes beneath each component directory.
          # The Ubuntu-packaged live-build helper currently looks one directory too high.
          sudo sed -i \
            -e 's@/dists/\${LB_PARENT_DISTRIBUTION}/Contents-@/dists/\${LB_PARENT_DISTRIBUTION}/main/Contents-@g' \
            -e 's@/dists/\${LB_DISTRIBUTION}/Contents-@/dists/\${LB_DISTRIBUTION}/main/Contents-@g' \
            /usr/lib/live/build/lb_chroot_linux-image
      - name: Configure live image
        run: sudo sh auto/config
      - name: Provide ISOLINUX files expected by live-build
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /root/isolinux

          # Resolve the installed package paths rather than assuming a fixed layout.
          isolinux_path="$(dpkg -L isolinux | grep -E '/isolinux\.bin$' | head -n 1 || true)"
          vesamenu_path="$(dpkg -L syslinux-common | grep -E '/vesamenu\.c32$' | grep '/bios/' | head -n 1 || true)"

          if [[ -z "$isolinux_path" || ! -s "$isolinux_path" ]]; then
            echo "Could not locate isolinux.bin from the installed isolinux package."
            dpkg -L isolinux
            exit 1
          fi
          if [[ -z "$vesamenu_path" || ! -s "$vesamenu_path" ]]; then
            echo "Could not locate BIOS vesamenu.c32 from the installed syslinux-common package."
            dpkg -L syslinux-common
            exit 1
          fi

          sudo install -D -m 0644 "$isolinux_path" /root/isolinux/isolinux.bin
          sudo install -D -m 0644 "$vesamenu_path" /root/isolinux/vesamenu.c32
          sudo test -s /root/isolinux/isolinux.bin
          sudo test -s /root/isolinux/vesamenu.c32
      - name: Build live image
        run: sudo lb build
      - name: Verify image exists
        run: |
          test -s live-image-amd64.hybrid.iso
          ls -lh live-image-amd64.hybrid.iso
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: McCrack-COS-live-amd64
          path: live-image-amd64.hybrid.iso
          if-no-files-found: error
          retention-days: 7
