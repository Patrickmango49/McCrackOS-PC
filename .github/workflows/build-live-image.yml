name: Build McCrack-COS live image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - "branding/**"
      - "scripts/**"
      - ".github/workflows/build-live-image.yml"

permissions:
  contents: read

concurrency:
  group: mccrack-cos-live-image
  cancel-in-progress: true

jobs:
  build:
    name: Build Debian Trixie KDE live image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            xorriso \
            debootstrap \
            squashfs-tools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            isolinux \
            syslinux-common
      - name: Patch live-build Contents index lookup
        run: |
          # Debian publishes Contents indexes beneath each component directory.
          # The Ubuntu-packaged live-build helper currently looks one directory too high.
          sudo sed -i \
            -e 's@/dists/\${LB_PARENT_DISTRIBUTION}/Contents-@/dists/\${LB_PARENT_DISTRIBUTION}/main/Contents-@g' \
            -e 's@/dists/\${LB_DISTRIBUTION}/Contents-@/dists/\${LB_DISTRIBUTION}/main/Contents-@g' \
            /usr/lib/live/build/lb_chroot_linux-image
      - name: Configure live image
        run: sudo sh auto/config
      - name: Provide ISOLINUX files expected by live-build
        run: |
          # live-build's syslinux helper expects these at /root/isolinux.
          # Ubuntu ships the actual binaries in the ISOLINUX and syslinux module directories.
          sudo install -D -m 0644 /usr/lib/ISOLINUX/isolinux.bin /root/isolinux/isolinux.bin
          sudo install -D -m 0644 /usr/lib/syslinux/modules/bios/vesamenu.c32 /root/isolinux/vesamenu.c32
          test -s /root/isolinux/isolinux.bin
          test -s /root/isolinux/vesamenu.c32
      - name: Build live image
        run: sudo lb build
      - name: Verify image exists
        run: |
          test -s live-image-amd64.hybrid.iso
          ls -lh live-image-amd64.hybrid.iso
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: McCrack-COS-live-amd64
          path: live-image-amd64.hybrid.iso
          if-no-files-found: error
          retention-days: 7
