name: Build McCrack-COS live image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mccrack-cos-live-image
  cancel-in-progress: true

jobs:
  build:
    name: Build Debian Trixie KDE live image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            xorriso \
            debootstrap \
            squashfs-tools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools
      - name: Configure live image
        run: sudo sh auto/config
      - name: Build live image
        run: sudo lb build
      - name: Verify image exists
        run: |
          test -s live-image-amd64.hybrid.iso
          ls -lh live-image-amd64.hybrid.iso
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: McCrack-COS-live-amd64
          path: live-image-amd64.hybrid.iso
          if-no-files-found: error
          retention-days: 7
